<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- EduM8 favicon-optimized mark: bolder ring + geometric two-circle "8" for legibility at 16px -->
  <!-- Magnifying glass ring -->
  <circle cx="26" cy="26" r="16" fill="none" stroke="#2F5FE0" stroke-width="8.5"/>
  <!-- Handle -->
  <line x1="37.5" y1="37.5" x2="50" y2="50" stroke="#2F5FE0" stroke-width="9" stroke-linecap="round"/>
  <!-- Geometric "8": two stacked rings (donut/infinity construction) -->
  <circle cx="26" cy="19.5" r="6.4" fill="none" stroke="#DDA14B" stroke-width="4.4"/>
  <circle cx="26" cy="32.5" r="6.9" fill="none" stroke="#DDA14B" stroke-width="4.8"/>
</svg>
