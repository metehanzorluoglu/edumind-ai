[project]
name = "rag-backend"
version = "0.1.0"
description = "Local RAG backend for the education-research assistant (FastAPI + Ollama + Qdrant)."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "ollama>=0.4",
  "qdrant-client>=1.11",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyjwt>=2.9",
  "cryptography>=43.0",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "citeproc-py>=0.10.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx2>=2.0",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-beautifulsoup4>=4.12",
  "bibtexparser>=1.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cli"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "cli", "scripts", "evaluation"]

[tool.ruff.lint.per-file-ignores]
# Milestone 4.2 (Citation & BibTeX Foundation): this file's fixtures are
# real, captured citeproc-py output strings (see its own module
# docstring) — the en dashes (RUF001) are genuine APA/IEEE punctuation
# citeproc-py renders, and long full-citation-text lines (E501) can't be
# wrapped without breaking the exact string-equality assertions they
# exist to make.
"tests/unit/core/test_citation_formatting.py" = ["E501", "RUF001"]
# Milestone 4.2: dense fixture-construction tests (many short-lived
# CitationItem literals per test) genuinely read better as 2-3 wide lines
# than wrapped across many — same reasoning as above, narrower scope.
"tests/unit/core/test_bibtex.py" = ["E501"]
"tests/unit/api/test_routes_documents_citation.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
# Milestone 4.2 (Citation & BibTeX Foundation): citeproc-py ships no
# py.typed marker / stub package. app/core/citation_formatting.py is the
# only module that imports it, and confines every citeproc-py value to
# that one file (converted to/from our own typed CitationItem at the
# boundary) — see that module's own docstring.
module = "citeproc.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# live_probabilistic tests are excluded by default (milestone 9 §12): they
# observe real LLM sampling behavior and can legitimately vary run to run,
# so "the standard test suite" must not fail because of model sampling.
# Run them explicitly with: pytest tests/ -m live_probabilistic
addopts = "-ra --strict-markers -m \"not live_probabilistic\""
markers = [
  "live_probabilistic: non-deterministic live-model behavior observation, not a deterministic guarantee (excluded from the default run; see tests/integration/test_live_ollama_smoke.py)",
]
filterwarnings = [
  # PyMuPDF's SWIG bindings emit this on interpreter shutdown; not actionable from here.
  "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
  # Expected when deliberately testing against an unreachable Qdrant server.
  "ignore:Failed to obtain server version.*:UserWarning",
]
