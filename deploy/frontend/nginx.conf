server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Favicon/manifest exceptions to the immutable rule below — these are
    # the one class of static asset Expo's web export does NOT
    # content-hash into its filename, so a redeploy ships new bytes at
    # the exact same URL an old immutable cache is still confidently
    # serving from. Short-lived + must-revalidate means a redeploy is
    # visible within minutes instead of the full year every other static
    # asset gets. The favicon PNG/SVG files themselves are version-tagged
    # in their filenames (favicon-v1.svg, etc. — see app/+html.tsx) as
    # the primary cache-busting mechanism; this is the defense-in-depth
    # backstop for favicon.ico and manifest.json specifically, which stay
    # at fixed conventional paths and can't be renamed the same way.
    location = /favicon.ico {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.json {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}