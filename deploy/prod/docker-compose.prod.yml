# Raspberry Pi 5 production deployment:
# - Expo web frontend served by nginx
# - FastAPI backend
# - Alembic database migration runner
# - Ollama
# - Qdrant
#
# Usage:
#   docker compose \
#     -f deploy/prod/docker-compose.prod.yml \
#     --env-file deploy/prod/.env.prod \
#     up -d
#
# The project name intentionally remains `edumind-rpi5` so this production
# configuration reuses the existing containers, networks, and persistent
# Docker volumes from the original Raspberry Pi deployment.
name: edumind-rpi5

services:
  frontend:
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}

    platform: linux/arm64
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - edumind-rpi5-net

  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/arm64

    # Qdrant's HTTP API is published only on the Pi's loopback interface.
    # Other containers communicate with it through the Docker network.
    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant-data:/qdrant/storage

    mem_limit: 2g
    cpus: "1.5"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    restart: unless-stopped

    networks:
      - edumind-rpi5-net

  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64

    volumes:
      - ollama-data:/root/.ollama

    mem_limit: 6g
    cpus: "3"

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_DEBUG: "0"

    expose:
      - "11434"

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

    restart: unless-stopped

    networks:
      - edumind-rpi5-net

  # One-shot database migration service.
  #
  # Alembic migrations are applied before the backend starts. A successful,
  # already-current migration exits with status code 0.
  backend-migrate:
    build:
      context: ../../rag-backend
      dockerfile: ../deploy/rpi5/Dockerfile.rpi5

    platform: linux/arm64

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    env_file:
      - .env.prod

    environment:
      PYTHONPATH: "/app"

    volumes:
      - backend-data:/data

    restart: "no"

    depends_on:
      qdrant:
        condition: service_healthy

    networks:
      - edumind-rpi5-net

  backend:
    build:
      context: ../../rag-backend
      dockerfile: ../deploy/rpi5/Dockerfile.rpi5

    platform: linux/arm64

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2"
      ]

    env_file:
      - .env.prod

    environment:
      PYTHONPATH: "/app"

    ports:
      - "8000:8000"

    mem_limit: 4g
    cpus: "2.5"

    volumes:
      - backend-data:/data

    # The frontend waits for the backend to become healthy. Python is already
    # installed in the backend image, so this probe does not depend on curl or
    # wget being present.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

    networks:
      - edumind-rpi5-net

volumes:
  backend-data:
    name: edumind-rpi5_backend-data

  qdrant-data:
    name: edumind-rpi5_qdrant-data

  ollama-data:
    name: edumind-rpi5_ollama-data

networks:
  edumind-rpi5-net:
    name: edumind-rpi5_net
    driver: bridge
