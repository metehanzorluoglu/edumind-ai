# Raspberry Pi 5 production deployment:
# - Expo web frontend served by nginx
# - FastAPI backend
# - Alembic database migration runner
# - Ollama
# - Qdrant
#
# Usage:
#   docker compose \
#     -f deploy/prod/docker-compose.prod.yml \
#     --env-file deploy/prod/.env.prod \
#     up -d
#
# The project name intentionally remains `edumind-rpi5` so this production
# configuration reuses the existing containers, networks, and persistent
# Docker volumes from the original Raspberry Pi deployment.
name: edumind-oracle

services:
  frontend:
    build:
      context: ../..
      dockerfile: deploy/frontend/Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL}

    platform: linux/arm64
    restart: unless-stopped

    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - edumind-rpi5-net

  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/arm64

    # Qdrant's HTTP API is published only on the Pi's loopback interface.
    # Other containers communicate with it through the Docker network.
    ports:
      - "127.0.0.1:6333:6333"

    volumes:
      - qdrant-data:/qdrant/storage

    mem_limit: 2g
    cpus: "0.5"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    restart: unless-stopped

    networks:
      - edumind-rpi5-net

  ollama:
    image: ollama/ollama:latest
    platform: linux/arm64

    volumes:
      - ollama-data:/root/.ollama

    mem_limit: 18g

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      # Overridable via .env.oracle — default 2 unchanged. A live
      # investigation (see this repo's vision-attachment-timeout task
      # report) measured qwen3:8b (5.9GB) + qwen2.5vl:7b (5.8GB) resident
      # together at ~11.7GB, and separately qwen3:8b + qwen2.5vl:3b
      # (3.2GB) at ~9.1GB — both comfortably under this container's 18GB
      # mem_limit above, with mxbai-embed-large (~0.7GB) easily fitting
      # alongside either pair too (~12.4GB combined). The constraint at 2
      # is therefore a *model-count* limit, not a measured memory
      # constraint: a conversation that alternates text and vision (or
      # sends a vision+corpus message needing the embedding model too)
      # can trigger avoidable evict-and-reload cycles under the default.
      # Raising to 3 is supported by this measurement but deliberately
      # left as an opt-in override, not a new default — see the README's
      # "Model residency" section before changing it on a host running
      # anything other than exactly these three models.
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-2}"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_DEBUG: "0"

    expose:
      - "11434"

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 60s

    restart: unless-stopped

    networks:
      - edumind-rpi5-net

  # One-shot database migration service.
  #
  # Alembic migrations are applied before the backend starts. A successful,
  # already-current migration exits with status code 0.
  backend-migrate:
    build:
      context: ../../rag-backend
      dockerfile: ../deploy/rpi5/Dockerfile.rpi5

    platform: linux/arm64

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    env_file:
      - .env.oracle

    environment:
      PYTHONPATH: "/app"

    volumes:
      - backend-data:/data

    restart: "no"

    depends_on:
      qdrant:
        condition: service_healthy

    networks:
      - edumind-rpi5-net

  # Milestone 11 (Evidence Service & Shadow Infrastructure Implementation)
  # — a stateless, internal-only NLI/entailment classification service for
  # the (currently OFF-by-default — see EVIDENCE_ANALYSIS_ENABLED in
  # .env.oracle) evidence-analysis shadow track. No database, no Qdrant,
  # no Ollama, no public port — see evidence-service/README.md and the
  # Milestone 11 report for the full design. Deliberately its OWN image
  # (not folded into the backend image): keeps torch/transformers out of
  # the primary backend image entirely (Milestone 10 §28), and keeps this
  # service's resource footprint independently boundable/restartable from
  # backend workers (Milestone 10 §26).
  evidence-service:
    build:
      context: ../../evidence-service
      dockerfile: Dockerfile

    platform: linux/arm64

    # Deliberately does NOT read .env.oracle (unlike backend/backend-
    # migrate below) — that file carries the FULL backend secret bundle
    # (JWT_SECRET, OAuth client secrets, SMTP password). This service has
    # no use for any of it (Settings in evidence-service/app/config.py
    # only ever reads EVIDENCE_SERVICE_*-prefixed variables, all of which
    # already have sensible defaults matching this compose file's own
    # setup — the /model-cache volume path, port 8100) and there is no
    # reason to expose that secret bundle inside a second container's
    # environment merely because it happens to share a compose file.
    # Add explicit `environment:` keys here (EVIDENCE_SERVICE_*) only if
    # a future override is ever needed.

    volumes:
      - evidence-model-cache:/model-cache

    # ~1.6GB RSS measured for the loaded model (Milestone 8-10) plus
    # tokenizer/runtime overhead; 2g gives headroom without being
    # excessive.
    #
    # cpus: "2.0" — NOT "1.0" as originally planned. A real on-host
    # measurement during Milestone 11 (see the report's "Real-Service
    # Performance" section) found cpus:"1.0" produced single-pair
    # latencies of ~1.1-1.5s and a batch-of-3 call that exceeded the 2.3s
    # internal timeout entirely — torch's default intra-op parallelism
    # still spawns threads matching the HOST's visible core count (4)
    # regardless of the cgroup CPU quota, so a too-tight quota causes
    # thread contention on top of the raw compute shortfall, not just a
    # proportional slowdown. Raising to 2.0 measurably improved (though
    # did not eliminate — this host has real concurrent production
    # traffic) latency and variance. This still leaves qdrant (0.5) +
    # backend (1.0) + evidence-service (2.0) = 3.5 of 4 OCPUs explicitly
    # reserved, with ollama uncapped and free to burst into whatever
    # remains — see the Milestone 11 report for the full, honest
    # measured numbers and the resulting recommendation to keep this
    # milestone's rollout at shadow (not enforced) scope specifically
    # because measured latency on this shared host is higher and more
    # variable than the earlier offline evaluation's clean-room numbers.
    mem_limit: 2g
    cpus: "2.0"

    # No `ports:` at all — Milestone 11 §7/§40: never published to the
    # host, never reachable outside this compose network. `expose` only
    # documents the container-internal port for other containers on the
    # same network; it publishes nothing.
    expose:
      - "8100"

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json, urllib.request; body = json.loads(urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).read()); raise SystemExit(0 if body.get('ready') else 1)"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      # Generous: a cold model load (weights download or disk read +
      # tokenizer init + sanity check) is a one-time startup cost, not a
      # steady-state latency concern (Milestone 10 §31) — see the
      # Milestone 11 report's real measured startup time.
      start_period: 90s

    restart: unless-stopped

    networks:
      - edumind-rpi5-net

  backend:
    build:
      context: ../../rag-backend
      dockerfile: ../deploy/rpi5/Dockerfile.rpi5

    platform: linux/arm64

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2"
      ]

    env_file:
      - .env.oracle

    environment:
      PYTHONPATH: "/app"

    ports:
      - "127.0.0.1:8000:8000"

    mem_limit: 4g
    cpus: "1.0"

    volumes:
      - backend-data:/data

    # The frontend waits for the backend to become healthy. Python is already
    # installed in the backend image, so this probe does not depend on curl or
    # wget being present.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if response.status == 200 else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

    # Deliberately does NOT depend on evidence-service (Milestone 11
    # §12/§30: "Backend must NOT depend on evidence service for startup
    # availability... Optional component must remain optional.") — chat
    # continues to work identically whether evidence-service is healthy,
    # still starting, or not running at all, since
    # EVIDENCE_ANALYSIS_ENABLED defaults to false and every call site
    # (app/core/evidence_shadow.py) treats a client failure as a
    # no-op-and-log outcome, never a raised exception.
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully

    networks:
      - edumind-rpi5-net

volumes:
  backend-data:
    name: edumind-rpi5_backend-data

  qdrant-data:
    name: edumind-rpi5_qdrant-data

  ollama-data:
    name: edumind-rpi5_ollama-data

  # Milestone 11 §10/§29: persists the pinned NLI model weights so
  # evidence-service never re-downloads the ~1.35GB model on a container
  # restart. Named consistently with the other volumes above (same
  # `edumind-rpi5_` prefix, even though the service itself is
  # Oracle-specific) — this compose project intentionally keeps that
  # legacy prefix for every volume, not just the ones inherited from the
  # original Pi deployment (see this file's own header comment).
  evidence-model-cache:
    name: edumind-rpi5_evidence-model-cache

networks:
  edumind-rpi5-net:
    name: edumind-rpi5_net
    driver: bridge
